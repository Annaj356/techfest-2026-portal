name: TechFest CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install & Build Backend
      run: |
        cd techfest-backend
        npm ci

    - name: Install & Build Frontend
      run: |
        cd techfest-frontend
        npm ci
        npm run build